[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-review"
version = "0.1.0"
description = "AI-powered Fedora package review for Fedora CI, driven by the fedora-package-review-koji/-copr Claude Code skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
llm-review = "llm_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_review"]

# The skills live at the top-level `skills/` directory (kept there so
# they're easy to diff/edit, and so skills/_fragments/ can be shared between
# them -- see scripts/build_skills.py), not inside src/llm_review/ -- bundle
# each as package data so it survives a regular non-editable `pip install`,
# not just an editable/in-place checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/fedora-package-review-koji" = "llm_review/skill_data/fedora-package-review-koji"
"skills/fedora-package-review-copr" = "llm_review/skill_data/fedora-package-review-copr"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
